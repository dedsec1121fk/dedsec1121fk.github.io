name: Refresh TikDev discovery cache

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tikdev-weekly-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh weekly GitHub and audio link snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_tikdev_weekly.py
      - name: Validate snapshot and publish changed data only
        run: |
          python3 -m json.tool DedSec-Project-Website/data/tikdev-weekly.json >/dev/null
          if git diff --quiet -- DedSec-Project-Website/data/tikdev-weekly.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DedSec-Project-Website/data/tikdev-weekly.json
          git commit -m "Refresh TikDev weekly discovery and audio health snapshot"
          git push
