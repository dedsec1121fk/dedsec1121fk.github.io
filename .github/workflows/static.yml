name: Repository-aware GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 4 */2 * *"
      timezone: "Europe/Athens"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Audit source consistency
        run: python3 scripts/audit_source.py

      - name: Detect repository and build correct deployment
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_for_repository.py --repository "$GITHUB_REPOSITORY" --output _site

      - name: Validate all pages and links
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/validate_site.py --root _site --repository "$GITHUB_REPOSITORY"

      - name: Check JavaScript syntax
        run: |
          find _site -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Check Python syntax
        run: python3 -m compileall -q scripts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
